<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Save Raju Leaderboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ===== SETTINGS: paste the same Apps Script URL as in index.html, and your game's public link ===== */
</style>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwKeAFrjzUWL-ny77NMkrcdud3hFdaItkL09ocPfvuCikx9Q9dsa7rDZ7L7os5p5MY/exec";   // e.g. "https://script.google.com/macros/s/XXXX/exec"
const GAME_URL  = "https://indianculturalday.github.io/saveraju/";   // e.g. "https://yourname.github.io/save-raju/"
const CLOSES_AT = "";   // optional, e.g. "18:00" – shown on screen
</script>
<style>
:root{ --night:#1d0f2e; --panel:#2b1745; --panel-hi:#3a2060; --marigold:#ffb627; --rani:#e8368f; --peacock:#19a7a0; --cream:#fff3d6; --dim:#8f7aad;
  --display:"Press Start 2P", ui-monospace, monospace; --body:"VT323", ui-monospace, monospace; color-scheme:dark; }
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.wrap{height:100%;display:grid;grid-template-columns:1fr minmax(260px,28vw);gap:3vw;padding:3vw 4vw}
h1{font-family:var(--display);font-size:clamp(20px,3.2vw,48px);color:var(--marigold);text-shadow:4px 4px 0 var(--rani);margin:0 0 1.2vw}
.sub{font-family:var(--display);font-size:clamp(9px,1vw,15px);color:var(--peacock);letter-spacing:.08em;margin:0 0 2vw;line-height:1.8}
table{width:100%;border-collapse:collapse;font-size:clamp(20px,2.3vw,38px)}
td{padding:.35vw .8vw;border-bottom:2px solid var(--panel-hi);white-space:nowrap}
td.r{font-family:var(--display);font-size:clamp(10px,1.2vw,20px);color:var(--dim);width:4.5vw}
td.n{overflow:hidden;text-overflow:ellipsis;max-width:30vw}
td.s{font-family:var(--display);font-size:clamp(12px,1.5vw,24px);color:var(--marigold);text-align:right;font-variant-numeric:tabular-nums}
td.c{color:var(--dim);text-align:right;width:9vw}
tr.top1 td{color:var(--marigold)} tr.top1 td.n::after{content:"  ★";color:var(--rani)}
tr.final td.r{color:var(--marigold)}
tr.cutoff td{border-bottom:3px dashed var(--rani)}
tr.top1{background:rgba(255,182,39,.10)} tr.top2,tr.top3{background:rgba(25,167,160,.08)}
tr.new td{animation:flash 1.2s 2}
@keyframes flash{50%{background:rgba(232,54,143,.35)}}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vw;text-align:center;border:4px solid var(--marigold);box-shadow:0 0 0 4px var(--rani);padding:2vw;background:var(--panel)}
.side .scan{font-family:var(--display);font-size:clamp(12px,1.5vw,24px);color:var(--marigold);line-height:1.5}
#qr{background:#fff;padding:12px;line-height:0} #qr img,#qr canvas{width:min(20vw,320px)!important;height:auto!important}
.url{font-size:clamp(16px,1.5vw,24px);color:var(--dim);word-break:break-all}
.stats{font-family:var(--display);font-size:clamp(9px,.95vw,14px);color:var(--peacock);line-height:2}
.empty{font-size:clamp(22px,2.4vw,40px);color:var(--dim);padding:2vw 0}
.foot{font-size:clamp(14px,1.2vw,20px);color:var(--dim);margin-top:1.2vw}
@media (prefers-reduced-motion:reduce){tr.new td{animation:none}}
</style></head>
<body>
<div class="wrap">
  <main>
    <h1>SAVE RAJU · TOP 10</h1>
    <p class="sub" id="sub">SURVIVAL MODE · FIRST GAME COUNTS</p>
    <table><tbody id="rows"><tr><td class="empty">Waiting for the first scores…</td></tr></tbody></table>
    <p class="foot" id="foot"></p>
  </main>
  <aside class="side">
    <div class="scan">SCAN TO PLAY</div>
    <div id="qr"></div>
    <div class="url" id="url"></div>
    <div class="stats" id="stats"></div>
  </aside>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let prev = {};
if (GAME_URL){ $("url").textContent = GAME_URL.replace(/^https?:\/\//,""); try { new QRCode($("qr"), { text: GAME_URL, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M }); } catch(e) {} }
else { $("qr").hidden = true; $("url").textContent = "Set GAME_URL to show the QR code"; }
if (CLOSES_AT) $("sub").textContent = "SURVIVAL MODE · FIRST GAME COUNTS · TOP SCORE AT " + CLOSES_AT + " WINS";

function render(d){
  const top = (d.top || []).slice(0,10);
  if (!top.length){ $("rows").innerHTML = '<tr><td class="empty">Waiting for the first scores…</td></tr>'; }
  else $("rows").innerHTML = top.map((p,i) => {
    const key = p.nick + "|" + p.score, isNew = Object.keys(prev).length && !prev[key];
    return `<tr class="${i<3 ? "top"+(i+1) : ""}${i<5 ? " final" : ""}${i===4 ? " cutoff" : ""}${isNew ? " new" : ""}"><td class="r">${i+1}</td><td class="n">${esc(p.nick)}</td><td class="c">${p.correct} ✓</td><td class="s">${String(p.score).padStart(4,"0")}</td></tr>`;
  }).join("");
  prev = Object.fromEntries(top.map(p => [p.nick + "|" + p.score, 1]));
  $("stats").innerHTML = `${d.players || 0} PLAYERS<br>${d.games || 0} GAMES PLAYED`;
  $("foot").textContent = (d.demo ? "DEMO DATA · " : "") + "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"}) + " · refreshes every 20 seconds";
}
function load(){
  if (!SHEET_URL){ render({ demo:true, players:12, games:31, top:[
    {nick:"Priya",score:4140,correct:22},{nick:"Tom",score:3985,correct:21},{nick:"Ana",score:1760,correct:9},{nick:"Kenji",score:1590,correct:9},
    {nick:"Léa",score:1410,correct:8},{nick:"Omar",score:1300,correct:8},{nick:"Sofia",score:1180,correct:7},{nick:"Ravi",score:990,correct:6},
    {nick:"Max",score:860,correct:6},{nick:"Chen",score:640,correct:5}] }); return; }
  const cb = "lb" + Date.now(), s = document.createElement("script");
  window[cb] = d => { render(d); delete window[cb]; s.remove(); };
  s.onerror = () => { $("foot").textContent = "Can't reach the score sheet right now · retrying…"; s.remove(); };
  s.src = SHEET_URL + (SHEET_URL.includes("?") ? "&" : "?") + "callback=" + cb + "&t=" + Date.now();
  document.body.appendChild(s);
}
load(); setInterval(load, 20000);
})();
</script>
</body></html>
